<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — Elevate</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="main.css"><link rel="stylesheet" href="professional.css"><link rel="stylesheet" href="login.css"></head><body><header class="site-header"><div class="container nav-wrap"><a href="index.html" class="brand"><span class="brand-mark"><i class="bi bi-rocket-takeoff-fill"></i></span> Elevate</a><div class="nav-actions"><a href="index.html" class="btn btn-outline-primary btn-sm">Back home</a></div></div></header><main class="auth-page"><div class="auth-card"><div class="auth-heading"><span class="auth-icon"><i class="bi bi-shield-lock"></i></span><h1 id="formTitle">Welcome back</h1><p id="formSubtitle">Sign in to access your Elevate account.</p></div><div id="authAlert" class="alert d-none" role="alert"></div><form id="authForm" novalidate><div id="nameField" class="mb-3 d-none"><label class="form-label" for="name">Full name</label><input class="form-control" id="name" autocomplete="name"></div><div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" type="email" id="email" autocomplete="email" required></div><div id="passwordField" class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" type="password" id="password" minlength="8" autocomplete="current-password" required></div><div class="text-end mt-1 mb-3"><button id="forgotPasswordBtn" class="btn btn-link p-0 text-decoration-none small" type="button">Forgot password?</button></div><button class="btn btn-primary w-100" id="submitBtn" type="submit"><i class="bi bi-box-arrow-in-right me-1"></i> Sign in</button></form><div class="auth-switch"><span id="switchText">New to Elevate?</span> <button id="switchMode" class="btn btn-link p-0" type="button">Create an account</button></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="main.js"></script><script src="js/auth.js"></script><script src="login.js"></script></body></html>
