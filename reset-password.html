<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset password — Elevate</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="professional.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a href="index.html" class="brand"><span class="brand-mark"><i class="bi bi-rocket-takeoff-fill"></i></span> Elevate</a>
      <div class="nav-actions"><a href="login.html" class="btn btn-outline-primary btn-sm">Back to sign in</a></div>
    </div>
  </header>
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-heading">
        <span class="auth-icon"><i class="bi bi-shield-lock"></i></span>
        <h1>Choose a new password</h1>
        <p>Reset links expire after 60 minutes and can only be used once.</p>
      </div>
      <div id="resetAlert" class="alert d-none" role="alert"></div>
      <form id="resetForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="newPassword">New password</label>
          <input class="form-control" id="newPassword" type="password" minlength="8" autocomplete="new-password" required>
          <div class="form-text">Use at least 8 characters.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="confirmPassword">Confirm new password</label>
          <input class="form-control" id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
        </div>
        <button class="btn btn-primary w-100" id="resetSubmit" type="submit">Update password</button>
      </form>
      <div class="auth-switch"><a href="login.html">Return to sign in</a></div>
    </div>
  </main>
  <script src="js/auth.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
